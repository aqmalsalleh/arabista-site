<!DOCTYPE html>

<script>
(() => {
  'use strict';
  // Injected by Apps Script. This page has no dashboard and never displays a password.
  // ALLOWALL framing applies only here. Messages are accepted from the configured website origins.
  const ALLOWED = <?!= originsJson ?>;
  const SOURCE = 'arabista-review-bridge';

  function allowed(origin) {
    return Array.isArray(ALLOWED) && ALLOWED.indexOf(origin) !== -1;
  }

  function reply(target, origin, payload) {
    if (!target || !allowed(origin)) return;
    target.postMessage(payload, origin);
  }

  function announce() {
    if (!Array.isArray(ALLOWED)) return;
    ALLOWED.forEach(origin => {
      try { window.top.postMessage({source: SOURCE, type: 'ready'}, origin); } catch (e) {}
    });
  }

  function run(fn, args, done, fail) {
    const runner = google.script.run.withSuccessHandler(done).withFailureHandler(fail);
    if (fn === 'studioAuthenticate') runner.studioAuthenticate(args[0], args[1]);
    else if (fn === 'studioLogout') runner.studioLogout(args[0]);
    else if (fn === 'studioDispatch') runner.studioDispatch(args[0], args[1], args[2]);
    else fail(new Error('Unknown operation.'));
  }

  window.addEventListener('message', event => {
    if (!allowed(event.origin)) return;
    const data = event.data || {};
    if (data.source !== 'arabista-review-studio' || typeof data.id !== 'string') return;
    const args = Array.isArray(data.args) ? data.args : [];
    const respond = (ok, result, error) => reply(event.source, event.origin, {
      source: SOURCE, type: 'response', id: data.id, ok, result, error
    });
    if (!window.google || !google.script || !google.script.run) {
      respond(false, null, 'Apps Script bridge is unavailable.');
      return;
    }
    run(data.fn, args,
      result => respond(true, result, ''),
      err => respond(false, null, err && err.message ? err.message : 'Request failed.'));
  });

  if (document.readyState === 'complete') announce();
  else window.addEventListener('load', announce);
})();
</script>
