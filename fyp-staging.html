<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0c">
  <title>Arabista For You — Interface Preview (STAGING)</title>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --gold:#c0a062; --cream:#f5f1e8; --ink:#0b0b0c; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#171718; }
    body { font-family:Inter,system-ui,sans-serif; color:#fff; }
    button { font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
    svg { display:block; width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .app { position:relative; margin:auto; width:100%; max-width:440px; height:100dvh; max-height:956px; overflow:hidden; background:#050505; box-shadow:0 20px 75px rgba(0,0,0,.45); }
    .feed { position:relative; height:calc(100% - 54px - env(safe-area-inset-bottom, 0px)); overflow:hidden; touch-action:pan-y; overscroll-behavior:contain; }
    .track { height:100%; display:flex; flex-direction:column; will-change:transform; transition:transform 420ms cubic-bezier(.22,1,.36,1); }
    .slide { height:100%; flex:0 0 100%; position:relative; overflow:hidden; background:#090909; }
    .media { position:absolute; inset:0; overflow:hidden; display:grid; place-items:center; }
    .media video { width:100%; height:100%; object-fit:cover; object-position:center center; }
    .demo-media { background:radial-gradient(ellipse at 70% 25%,#8e806d 0%,transparent 38%), linear-gradient(145deg,#23242a,#51443f 50%,#161619); }
    .demo-media.alt { background:radial-gradient(ellipse at 20% 33%,#657273 0%,transparent 35%),linear-gradient(145deg,#121c20,#554c3d 65%,#131316); }
    .demo-shape { position:absolute; width:74%; aspect-ratio:3/4; border:1px solid rgba(235,213,177,.35); border-radius:45% 45% 8% 8%; background:linear-gradient(140deg,rgba(241,219,188,.22),rgba(20,20,24,.08)); box-shadow:0 20px 80px #0005; animation:float 6s ease-in-out infinite alternate; }
    .demo-copy { z-index:1; align-self:center; padding:14px 20px; text-align:center; font:600 31px/1.1 'Cormorant Garamond',serif; letter-spacing:.02em; text-shadow:0 2px 10px #000; }
    @keyframes float { to { transform:translateY(-22px) scale(1.025); } }
    .shade { position:absolute; inset:0; z-index:1; pointer-events:none; background:linear-gradient(180deg,rgba(0,0,0,.36),transparent 18%,transparent 56%,rgba(0,0,0,.13) 70%,rgba(0,0,0,.78)); }
    /* PHASE 1.2: TIKTOK-FAMILIAR HEADER */
    .topbar {
      position:absolute;
      top:max(12px,env(safe-area-inset-top,0px));
      left:12px;
      right:12px;
      z-index:5;
      display:grid;
      grid-template-columns:44px minmax(0,1fr) 44px;
      align-items:start;
    }

    .topbar .center {
      justify-self:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;
    }

    .topbar .foryou {
      font-size:16px;
      line-height:1.3;
      font-weight:700;
      letter-spacing:-.025em;
      text-shadow:0 1px 8px #000c;
    }

    .topbar .line {
      height:2px;
      width:27px;
      border-radius:99px;
      background:var(--cream);
    }

    .topbar button {
      border:0;
      background:transparent;
      padding:4px 7px;
      min-width:36px;
      min-height:36px;
      display:grid;
      place-items:center;
    }

    .topbar .search {
      justify-self:end;
    }

    .topbar svg {
      width:23px;
      height:23px;
    }

    /* PHASE 1.2: COMPACT VIDEO ACTION RAIL */
    .rail {
      position:absolute;
      right:7px;
      bottom:116px;
      z-index:4;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:13px;
      width:52px;
    }

    .rail button {
      border:0;
      background:transparent;
      padding:0;
      width:52px;
      min-height:45px;
      display:flex;
      align-items:center;
      flex-direction:column;
      justify-content:center;
      gap:4px;
      filter:drop-shadow(0 1px 3px #000b);
    }

    .rail svg {
      width:30px;
      height:30px;
      stroke-width:2.05;
    }

    .rail .count {
      font-size:10px;
      font-weight:600;
      line-height:1.15;
      letter-spacing:-.02em;
      white-space:nowrap;
    }

    /* PHASE 1.2: ARABISTA CREATOR AVATAR */
    .avatar {
      display:grid;
      place-items:center;
      width:42px;
      height:42px;
      border:2px solid #f5f1e8;
      outline:1px solid #c0a06288;
      outline-offset:1px;
      border-radius:50%;
      background:radial-gradient(circle at 30% 20%,#382a24,#151114);
      color:#dfc189;
      font:600 25px 'Cormorant Garamond',serif;
    }

    .rail .profile-action {
      margin-bottom:3px;
    }

    /* PHASE 1.2: VIDEO DESCRIPTION */
    .caption {
      position:absolute;
      left:12px;
      right:75px;
      bottom:16px;
      z-index:4;
      text-shadow:0 1px 4px #000c;
    }

    .tag {
      max-width:100%;
      border:1px solid #d4b58680;
      border-radius:5px;
      color:#fff;
      background:#161616c9;
      padding:6px 9px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:11px;
      font-weight:500;
      margin-bottom:10px;
      text-shadow:0 1px 2px #000;
    }

    .tag svg {
      width:14px;
      height:14px;
      color:#e1b565;
      flex:0 0 auto;
    }

    .creator {
      font-weight:700;
      font-size:15px;
      line-height:1.3;
      margin-bottom:5px;
    }

    .description {
      font-size:13px;
      line-height:1.38;
      margin:0 0 8px;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .sound {
      display:flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      line-height:1.3;
      font-weight:500;
    }

    .sound svg {
      width:14px;
      height:14px;
    }
    .player-buttons { position:absolute; right:12px; top:57px; z-index:5; }
    .player-buttons button { border:0; background:#0b0b0c80; border-radius:50%; display:grid; place-items:center; width:36px; height:36px; }
    .player-buttons svg { width:19px; height:19px; }
    .pause-cue { position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%); width:68px; height:68px; border-radius:50%; background:#0008; display:none; place-items:center; pointer-events:none; }
    .pause-cue svg { width:36px; height:36px; fill:white; stroke:none; }
    .pause-cue.show { display:grid; }
    .video-fallback { position:absolute; inset:35% 10%; display:grid; place-items:center; z-index:2; text-align:center; color:#ddd; font-size:13px; background:#121214; border:1px solid #444; border-radius:12px; padding:14px; }
    /* PHASE 1.2: FIVE-POSITION ARABISTA NAVIGATION */
    .bottom {
      height:calc(54px + env(safe-area-inset-bottom, 0px));
      padding-bottom:env(safe-area-inset-bottom,0px);
      background:#090909;
      border-top:1px solid #333;
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      align-items:center;
    }

    .bottom button {
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:3px;
      min-width:0;
      width:100%;
      height:52px;
      border:0;
      background:none;
      font-size:10px;
      font-weight:600;
      line-height:1.1;
      padding:3px 0;
    }

    .bottom svg {
      width:22px;
      height:22px;
    }

    .bottom .selected {
      color:var(--cream);
    }

    /* COMMERCE SHORTCUT — EXACTLY CENTERED IN COLUMN THREE */
    .bottom .shop-button {
      color:var(--gold);
    }

    .bottom .shop-glyph {
      width:39px;
      height:28px;
      display:grid;
      place-items:center;
      border:1px solid #c0a062b3;
      border-radius:7px;
      background:#c0a06221;
    }

    .bottom .shop-glyph svg {
      width:19px;
      height:19px;
      stroke-width:2;
    }
    .toast { position:absolute; left:50%; bottom:calc(77px + env(safe-area-inset-bottom,0px)); z-index:20; width:max-content; max-width:85%; padding:10px 14px; border-radius:30px; background:#242426ed; box-shadow:0 4px 25px #0008; color:#fff; text-align:center; font-size:12px; transform:translate(-50%,12px); opacity:0; pointer-events:none; transition:opacity .18s,transform .18s; }
    .toast.visible { opacity:1; transform:translate(-50%,0); }
    .sr-only { position:absolute; clip:rect(0,0,0,0); width:1px; height:1px; overflow:hidden; white-space:nowrap; }
    @media (min-width:700px) { body { display:grid; place-items:center; } .app { border-radius:14px; } }
    @media (max-width:699px) { .app { max-height:none; box-shadow:none; } }
    @media (prefers-reduced-motion:reduce) { .track,.toast { transition:none !important; } .demo-shape { animation:none; } }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="sr-only" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.5-4.5A8.5 8.5 0 1 1 20 11.5z"/><path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4V3z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M13 4l8 7-8 7v-4.2C7 13.8 4.5 16 2.5 20c.4-7.8 3.5-11.9 10.5-12V4z"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-3-3c1.7 0 3 1.3 3 3Zm12-2a3 3 0 1 1-3-3c1.7 0 3 1.3 3 3Z"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M4 9h16l-1.2 12H5.2L4 9zM9 9V7a3 3 0 0 1 6 0v2"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9a4 4 0 0 1 0 6M19.5 6a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9l5 6m0-6-5 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l14-8z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10h-6v-6H9v6H3V11z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2.5 4H5l2.2 11h11.7l2-8.5H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22a8 8 0 0 1 16 0"/></symbol>
  </svg>
  <main class="app" aria-label="Arabista shoppable video interface preview">
    <section class="feed" id="feed" aria-label="For You videos">
      <div class="track" id="track">
        <article class="slide" aria-label="Video 1: D06 Dahlia Series">
          <div class="media" id="video-hit-area">
            <video id="d06-video" muted autoplay loop playsinline preload="metadata" aria-label="D06 abaya demonstration">
              <source src="images/fyp-d06-shoppable-h264.mp4" type="video/mp4">
            </video>
          </div>
          <div class="pause-cue" id="pause-cue"><svg><use href="#i-play"/></svg></div>
          <div class="video-fallback" id="video-fallback" hidden>D06 video is unavailable. Verify the MP4 file and browser compatibility.</div>
        </article>
        <article class="slide" aria-label="Video 2: design placeholder">
          <div class="media demo-media"><div class="demo-shape"></div><div class="demo-copy">Editorial Concept<br>02</div></div>
        </article>
        <article class="slide" aria-label="Video 3: design placeholder">
          <div class="media demo-media alt"><div class="demo-shape"></div><div class="demo-copy">The Arabista Edit<br>03</div></div>
        </article>
      </div>
      <div class="shade"></div>
      <header class="topbar">
        <button aria-label="Menu (future phase)" data-soon="Menu"><svg><use href="#i-menu"/></svg></button>
        <div class="center"><span class="foryou">For You</span><span class="line"></span></div>
        <button class="search" aria-label="Search (future phase)" data-soon="Search"><svg><use href="#i-search"/></svg></button>
      </header>
      <div class="player-buttons"><button id="mute-button" aria-label="Unmute video"><svg><use id="mute-icon" href="#i-muted"/></svg></button></div>
      <aside class="rail" aria-label="Video actions">
        <button class="profile-action" data-soon="Creator profile" aria-label="Creator profile (future phase)"><span class="avatar" aria-hidden="true">A</span></button>
        <button data-soon="Likes" aria-label="Like video (future phase)"><svg><use href="#i-heart"/></svg><span class="count">Like</span></button>
        <button data-soon="Comments" aria-label="Comments (future phase)"><svg><use href="#i-chat"/></svg><span class="count">Comment</span></button>
        <button data-soon="Save" aria-label="Save video (future phase)"><svg><use href="#i-bookmark"/></svg><span class="count">Save</span></button>
        <button data-soon="Share" aria-label="Share video (future phase)"><svg><use href="#i-share"/></svg><span class="count">Share</span></button>
      </aside>
      <section class="caption" aria-label="Video information">
        <button class="tag" id="product-tag" data-soon="D06 shopping" aria-label="Shop D06 (future phase)"><svg><use href="#i-bag"/></svg><span>Shop | D06 Dahlia Abaya</span></button>
        <div class="creator" id="creator-name">@arabistaofficial</div>
        <p class="description" id="video-caption">Dahlia Series D06 · Premium Nidha Dubai abaya</p>
        <div class="sound"><svg><use href="#i-music"/></svg><span id="sound-title">Original sound · Arabista</span></div>
      </section>
    </section>
    <nav class="bottom" aria-label="Preview navigation">
      <button class="selected" data-soon="Home" aria-label="Home (current preview)">
        <svg aria-hidden="true"><use href="#i-home"/></svg>
        <span>Home</span>
      </button>

      <button data-soon="Discover" aria-label="Discover (future phase)">
        <svg aria-hidden="true"><use href="#i-grid"/></svg>
        <span>Discover</span>
      </button>

      <button class="shop-button" data-soon="Shop" aria-label="Shop (future phase)">
        <span class="shop-glyph">
          <svg aria-hidden="true"><use href="#i-bag"/></svg>
        </span>
        <span>Shop</span>
      </button>

      <button data-soon="Cart" aria-label="Cart (future phase)">
        <svg aria-hidden="true"><use href="#i-cart"/></svg>
        <span>Cart</span>
      </button>

      <button data-soon="Profile" aria-label="Profile (future phase)">
        <svg aria-hidden="true"><use href="#i-user"/></svg>
        <span>Profile</span>
      </button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="screen-reader-status" class="sr-only" aria-live="polite">Video 1 of 3</div>
  </main>
  <script>
    (() => {
      'use strict';
      const feed = document.getElementById('feed');
      const track = document.getElementById('track');
      const video = document.getElementById('d06-video');
      const cue = document.getElementById('pause-cue');
      const muteButton = document.getElementById('mute-button');
      const muteIcon = document.getElementById('mute-icon');
      const tag = document.getElementById('product-tag');
      const toast = document.getElementById('toast');
      const captions = [
        { creator:'@arabistaofficial', text:'Dahlia Series D06 · Premium Nidha Dubai abaya', sound:'Original sound · Arabista' },
        { creator:'@arabistaofficial · DEMO', text:'Editorial concept placeholder · No real product linked', sound:'Visual placeholder · No audio' },
        { creator:'@arabistaofficial · DEMO', text:'Future video concept placeholder · No real product linked', sound:'Visual placeholder · No audio' }
      ];
      const count = track.children.length;
      let active = 0;
      let transitioning = false;
      let startY = null;
      let toastTimer = null;
      let userPaused = false;

      function message(text) {
        toast.textContent = text;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('visible'), 1800);
      }
      function updatePauseCue() { cue.classList.toggle('show', active === 0 && video.paused); }
      function syncPlayback() {
        if (active !== 0) { video.pause(); cue.classList.remove('show'); return; }
        if (userPaused) { video.pause(); updatePauseCue(); return; }
        const attempt = video.play();
        if (attempt && typeof attempt.catch === 'function') attempt.catch(() => { updatePauseCue(); message('Tap the video to start playback'); });
        updatePauseCue();
      }
      function move(direction) {
        if (transitioning) return;
        const next = Math.max(0, Math.min(count - 1, active + direction));
        if (next === active) return;
        transitioning = true;
        active = next;
        track.style.transform = `translate3d(0, ${-active * 100}%, 0)`;
        document.getElementById('creator-name').textContent = captions[active].creator;
        document.getElementById('video-caption').textContent = captions[active].text;
        document.getElementById('sound-title').textContent = captions[active].sound;
        tag.hidden = active !== 0;
        muteButton.hidden = active !== 0;
        document.getElementById('screen-reader-status').textContent = `Video ${active + 1} of ${count}`;
        syncPlayback();
        window.setTimeout(() => { transitioning = false; }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 440);
      }
      feed.addEventListener('touchstart', e => { if (e.touches.length === 1) startY = e.touches[0].clientY; }, { passive:true });
      feed.addEventListener('touchend', e => {
        if (startY === null || e.changedTouches.length !== 1) { startY = null; return; }
        const change = startY - e.changedTouches[0].clientY;
        startY = null;
        if (Math.abs(change) >= 55) move(change > 0 ? 1 : -1);
      }, { passive:true });
      feed.addEventListener('touchcancel', () => { startY = null; }, { passive:true });
      feed.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > 25) { e.preventDefault(); move(e.deltaY > 0 ? 1 : -1); } }, { passive:false });
      window.addEventListener('keydown', e => {
        if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
        if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
        if (e.code === 'Space' && active === 0) { e.preventDefault(); togglePause(); }
      });
      function togglePause() {
        if (active !== 0) return;
        userPaused = !video.paused;
        syncPlayback();
      }
      document.getElementById('video-hit-area').addEventListener('click', togglePause);
      video.addEventListener('play', updatePauseCue);
      video.addEventListener('pause', updatePauseCue);
      video.addEventListener('error', () => { document.getElementById('video-fallback').hidden = false; message('D06 video failed to load'); });
      muteButton.addEventListener('click', () => {
        video.muted = !video.muted;
        muteIcon.setAttribute('href', video.muted ? '#i-muted' : '#i-volume');
        muteButton.setAttribute('aria-label', video.muted ? 'Unmute video' : 'Mute video');
      });
      document.querySelectorAll('[data-soon]').forEach(button => button.addEventListener('click', () => {
        const name = button.dataset.soon;
        message(name === 'Home' ? 'You are already in the For You preview' : `${name} is planned for a later phase`);
      }));
      document.addEventListener('visibilitychange', () => { if (document.hidden) video.pause(); else syncPlayback(); });
      syncPlayback();
    })();
  </script>
</body>
</html>
